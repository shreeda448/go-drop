<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Go-Drop</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        background: #1e1e2e;
        color: #cdd6f4;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
      }
      form {
        background: #313244;
        padding: 30px;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }
      button {
        background: #a6e3a1;
        border-radius: 2px;
        color: #11111b;
        font-weight: bold;
        padding: 12px;
        border: none;
        border-radius: 6px;
        font-size: 1.1rem;
        cursor: pointer;
      }
      .token {
        font-size: 0.8rem;
        color: #a6adc8;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Go-Drop</h1>
    <div class="token">Session: {{.Token}}</div>
    <form
      action="/upload?token={{.Token}}"
      method="POST"
      enctype="multipart/form-data"
    >
      <input type="file" name="file" required />
      <button type="submit">Send to Laptop</button>
    </form>
  </body>
</html>
